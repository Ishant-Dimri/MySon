<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Abhinav — Opening</title>
<link rel="stylesheet" href="style.css">
<style>
  .opening{ overflow:hidden; }

  /* black curtain that burns away */
  .curtain{
    position:fixed; inset:0; background:#000; z-index:40;
    animation:curtainOut 1.3s ease forwards; animation-delay:.5s;
  }
  @keyframes curtainOut{ to{ opacity:0; visibility:hidden; } }

  /* radiating speed-lines burst, classic anime impact frame */
  .speed-burst{
    position:fixed; inset:-20%;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,255,255,.16) 0deg 1.1deg,
      transparent 1.1deg 6deg);
    z-index:2; pointer-events:none;
    opacity:0;
    animation:burstFlash 1.4s ease-out forwards;
    animation-delay:.55s;
    mix-blend-mode:screen;
  }
  @keyframes burstFlash{
    0%{ opacity:0; transform:scale(.4) rotate(0deg); }
    12%{ opacity:.9; transform:scale(1) rotate(2deg); }
    100%{ opacity:0; transform:scale(1.6) rotate(6deg); }
  }

  .whiteflash{
    position:fixed; inset:0; background:#fff; z-index:41;
    opacity:0; animation:flashPop .5s ease-out forwards; animation-delay:.55s;
  }
  @keyframes flashPop{ 0%{opacity:0} 8%{opacity:.9} 100%{opacity:0} }

  .eyebrow-line{
    font-family:var(--body); font-size:.95rem; letter-spacing:.06em;
    color:var(--cream-dim);
    opacity:0; transform:translateY(10px);
    animation:lineIn .8s ease forwards; animation-delay:1.5s;
  }
  @keyframes lineIn{ to{ opacity:1; transform:translateY(0); } }

  .title-stack{ margin-top:.4rem; }

  .title-happy{
    font-family:var(--display);
    font-size:clamp(2rem, 7vw, 4.2rem);
    color:var(--cream);
    letter-spacing:.02em;
    opacity:0;
    transform:scale(.7);
    animation:popIn .7s cubic-bezier(.2,1.4,.4,1) forwards;
    animation-delay:1.9s;
  }

  .title-name{
    font-family:var(--display);
    font-size:clamp(3.4rem, 14vw, 8.5rem);
    line-height:1;
    margin-top:.15em;
    background:linear-gradient(180deg, var(--string) 0%, var(--flare) 120%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,201,77,.45));
    opacity:0;
    transform:scale(.55) rotate(-2deg);
    animation:namePop .8s cubic-bezier(.15,1.6,.35,1) forwards;
    animation-delay:2.35s;
  }
  @keyframes popIn{ 0%{opacity:0; transform:scale(.7)} 60%{opacity:1; transform:scale(1.08)} 100%{opacity:1; transform:scale(1)} }
  @keyframes namePop{ 0%{opacity:0; transform:scale(.5) rotate(-4deg)} 55%{opacity:1; transform:scale(1.12) rotate(1deg)} 100%{opacity:1; transform:scale(1) rotate(0)} }

  .subtitle{
    margin-top:1.6rem; max-width:36ch;
    color:var(--cream-dim); font-size:1.02rem; line-height:1.6;
    opacity:0; animation:lineIn .8s ease forwards; animation-delay:2.9s;
  }

  /* falling petals / confetti made of little bars in flare/string colors */
  .petals span{
    position:fixed; top:-5%; z-index:3; pointer-events:none;
    width:8px; height:14px; border-radius:2px;
    opacity:.85;
    animation:fall linear infinite;
  }
  @keyframes fall{
    to{ transform:translateY(115vh) rotate(340deg); }
  }

  .guitar-mark{
    position:absolute; bottom:6vh; opacity:0; font-size:1.6rem;
    animation:lineIn .8s ease forwards; animation-delay:3.1s;
    color:var(--spark);
  }
</style>
</head>
<body class="opening">
  <div class="stars"></div>
  <div class="curtain"></div>
  <div class="whiteflash"></div>
  <div class="speed-burst"></div>
  <div class="petals" id="petals"></div>

  <button class="sound-toggle" aria-label="toggle sound">🔊</button>
  <div class="page-index">SCENE 1 / 4 — OPENING</div>

  <main class="scene">
    <div class="eyebrow-line">a small production, just for one person</div>
    <div class="title-stack">
      <div class="title-happy">Happy Birthday</div>
      <div class="title-name">My Son</div>
    </div>
    <p class="subtitle">Turn your volume up. This one's got fireworks, guitar strings, and a few things I've been meaning to tell you.</p>
    <span class="guitar-mark">🎸</span>
    <a class="next-link" href="fireworks.html">Begin the show →</a>
  </main>

<script>
  // scatter falling petals in flare / string / spark colors
  const petalHost = document.getElementById('petals');
  const colors = ['#FF3E7F', '#FFC94D', '#6FE3FF'];
  for (let i = 0; i < 26; i++){
    const p = document.createElement('span');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.animationDelay = (Math.random() * 6) + 's';
    petalHost.appendChild(p);
  }
</script>
<script src="audio.js"></script>
</body>
</html>
